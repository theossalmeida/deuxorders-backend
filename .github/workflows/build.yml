name: DeuxERP CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  schedule:
    # 06:00 America/Sao_Paulo (09:00 UTC). GitHub schedules use UTC.
    - cron: "0 9 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

jobs:
  test:
    name: Build, unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write
      pull-requests: write

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: deuxerp_tests
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d deuxerp_tests"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      JwtSettings__Secret: ci-test-secret-placeholder-for-build-pipeline
      PUSH_ENABLED: "false"
      ALLOWED_ORIGINS: http://localhost
      TEST_DATABASE_CONNECTION_STRING: Host=localhost;Port=5432;Database=deuxerp_tests;Username=postgres;Password=postgres
      XRAY_CLIENT_ID: ${{ secrets.XRAY_CLIENT_ID }}
      XRAY_CLIENT_SECRET: ${{ secrets.XRAY_CLIENT_SECRET }}
      XRAY_PROJECT_KEY: DEUX
      XRAY_TEST_PLAN_KEY: DEUX-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore DeuxERP.slnx

      - name: Build
        run: dotnet build DeuxERP.slnx --configuration Release --no-restore

      - name: Run unit tests
        run: >-
          dotnet test DeuxERP.UnitTests/DeuxERP.UnitTests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=unit-tests.trx"
          --logger "junit;LogFilePath=TestResults/unit-tests.xml"
          --collect "XPlat Code Coverage"

      - name: Run PostgreSQL integration tests
        if: ${{ !cancelled() }}
        run: >-
          dotnet test DeuxERP.Tests/DeuxERP.Tests.csproj
          --configuration Release
          --no-build
          --logger "trx;LogFileName=integration-tests.trx"
          --logger "junit;LogFilePath=TestResults/integration-tests.xml"
          --collect "XPlat Code Coverage"

      - name: Upload test results and coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_attempt }}
          path: |
            **/TestResults/**/*.trx
            **/TestResults/**/*.xml
            **/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 30

      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2
        if: always()
        with:
          name: xUnit test results
          path: "**/TestResults/**/*.trx"
          reporter: dotnet-trx
          fail-on-error: true

      - name: Import test results into Xray Cloud
        if: ${{ always() && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          if [[ -z "$XRAY_CLIENT_ID" || -z "$XRAY_CLIENT_SECRET" ]]; then
            echo "Xray credentials are not configured; skipping result import."
            exit 0
          fi

          xray_token="$(
            jq -n \
              --arg client_id "$XRAY_CLIENT_ID" \
              --arg client_secret "$XRAY_CLIENT_SECRET" \
              '{client_id: $client_id, client_secret: $client_secret}' |
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Content-Type: application/json" \
              --data-binary @- \
              "https://xray.cloud.getxray.app/api/v2/authenticate" |
            tr -d '"'
          )"
          echo "::add-mask::$xray_token"

          import_xray_report() {
            local report="$1"

            if [[ ! -f "$report" ]]; then
              echo "Xray report was not generated: $report"
              return 0
            fi

            echo "Importing $report into Xray"
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $xray_token" \
              --header "Content-Type: text/xml" \
              --data-binary "@$report" \
              "https://xray.cloud.getxray.app/api/v2/import/execution/junit?projectKey=${XRAY_PROJECT_KEY}&testPlanKey=${XRAY_TEST_PLAN_KEY}&revision=${GITHUB_SHA}"
            echo
          }

          import_xray_report "DeuxERP.UnitTests/TestResults/unit-tests.xml"
          import_xray_report "DeuxERP.Tests/TestResults/integration-tests.xml"
